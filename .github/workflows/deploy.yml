name: Deploy site

# Static site: src/build.py writes the HTML into the repo root; this job
# rebuilds it (so a forgotten local build cannot ship stale pages) and
# publishes everything except sources to the gh-pages branch.
on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: python3 src/build.py

      - name: Collect site
        run: |
          mkdir _site
          rsync -a --exclude .git --exclude .github --exclude src --exclude _site --exclude .gitignore ./ _site/
          touch _site/.nojekyll

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
